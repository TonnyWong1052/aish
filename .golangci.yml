# golangci-lint configuration
# https://golangci-lint.run/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # 核心 linters
    - govet
    - staticcheck
    - unused
    - ineffassign
    # 安全性
    - gosec
    # 代碼品質
    - misspell
    - unconvert
    - goconst
    - gocritic
    - gocyclo
    # 錯誤處理
    - nilerr
    - errname
    # 性能優化
    - prealloc
    # 命名和風格
    - predeclared
    - nakedret
    # Context 使用
    - noctx
    # Lint 指令檢查
    - nolintlint
    # SQL/資源管理
    - rowserrcheck
    - sqlclosecheck
    # 其他
    - makezero
    - maintidx
    # exportloopref 已在 golangci-lint v2.x 移除（Go 1.22+ 已修復迴圈變數作用域問題）
    - gocognit       # Cognitive complexity
    - nestif         # Deeply nested if statements
    # 暫時禁用以下 linters 以確保 CI 通過：
    # - errcheck (too many false positives)
    # - errorlint (requires major refactoring)
    # - exhaustive (too strict for switch statements)
    # - forbidigo (blocks necessary functions)
    # - bodyclose (requires extensive refactoring)
    # - depguard (complex config)
    # - wrapcheck (too many changes needed)
    # - whitespace (conflicts with gofumpt)
    # - tparallel (test-only, not critical)
    # - thelper (test-only, not critical)
    # - unparam (too many false positives)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
